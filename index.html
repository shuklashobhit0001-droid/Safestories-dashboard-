<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safestories - Redirecting...</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f9fafb;
        color: #1f2937;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="loader"></div>
      <h1>Redirecting to the new dashboard...</h1>
      <p>If you are not redirected automatically, <a id="fallback-link" href="https://panel.safestories.in">click here</a>.</p>
    </div>
    <script>
      // Perform client-side redirect preserving the path
      var currentPath = window.location.pathname;
      var currentSearch = window.location.search;
      var destination = "https://panel.safestories.in" + currentPath + currentSearch;
      
      var link = document.getElementById('fallback-link');
      if (link) {
        link.href = destination;
      }

      // Attempt the redirect
      setTimeout(function() {
        window.location.replace(destination);
      }, 500);
    </script>
  </body>
</html>
